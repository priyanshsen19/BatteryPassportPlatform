# Keeps the Render backend services awake by calling their health endpoints every 5 minutes
# (Render's free instances sleep after 15 minutes without traffic), but only until the time in
# the repository variable KEEP_ALIVE_UNTIL (ISO 8601, e.g. 2026-10-03T06:50:00Z). Scheduled runs
# after that time do nothing, so free instance hours (750 a month per workspace) are only spent
# during a review or demo window. Delete the variable to stop early.
#
# "Run workflow" in the Actions tab wakes every service once at any time. Outside the window the
# web app, on Vercel, wakes the backends whenever someone opens a page.
name: Keep alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UNTIL: ${{ vars.KEEP_ALIVE_UNTIL }}
      URLS: >-
        ${{ vars.KEEP_ALIVE_URLS || 'https://bpp-auth-service.onrender.com/health
        https://bpp-passport-service.onrender.com/health
        https://bpp-document-service.onrender.com/health
        https://bpp-notification-service.onrender.com/health' }}
    steps:
      - name: Check the keep-alive window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$UNTIL" ] && [ "$(date -u +%s)" -lt "$(date -u -d "$UNTIL" +%s)" ]; then
            echo "Keeping services awake until $UNTIL"
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside the keep-alive window (KEEP_ALIVE_UNTIL='${UNTIL}'); nothing to do"
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping services
        if: steps.window.outputs.active == 'true'
        run: |
          failed=0
          for url in $URLS; do
            # A sleeping service can take up to a minute to start.
            if code=$(curl -s -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 "$url") && [ "$code" -lt 400 ]; then
              echo "OK   $code $url"
            else
              echo "FAIL ${code:-000} $url"; failed=1
            fi
          done
          exit $failed
