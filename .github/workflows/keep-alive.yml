# Wakes every Render backend service on demand (Actions → Keep alive → Run workflow), e.g. just
# before a demo. Day to day this is not needed: the web app, on Vercel, pings the backends
# whenever someone opens a page, and waits for them while they start.
#
# There is deliberately no schedule: free instance hours are shared by the whole Render workspace
# (750 per month), which only covers one service around the clock.
name: Keep alive

on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URLS: >-
        ${{ vars.KEEP_ALIVE_URLS || 'https://bpp-auth-service.onrender.com/health
        https://bpp-passport-service.onrender.com/health
        https://bpp-document-service.onrender.com/health
        https://bpp-notification-service.onrender.com/health' }}
    steps:
      - name: Ping services
        run: |
          failed=0
          for url in $URLS; do
            # A sleeping service can take up to a minute to start.
            if code=$(curl -s -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 "$url") && [ "$code" -lt 400 ]; then
              echo "OK   $code $url"
            else
              echo "FAIL ${code:-000} $url"; failed=1
            fi
          done
          exit $failed
