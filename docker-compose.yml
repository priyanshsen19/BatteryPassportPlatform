name: battery-passport-platform

x-node-service: &node-service
  restart: unless-stopped
  environment: &common-env
    NODE_ENV: ${NODE_ENV:-production}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is used by containers (kafka:9092), EXTERNAL by processes on the host (localhost:29092)
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '29092:29092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  localstack:
    image: localstack/localstack:3.8
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-battery-passport-documents}
    ports:
      - '4566:4566'
    volumes:
      - ./infrastructure/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3api head-bucket --bucket "$$AWS_S3_BUCKET" > /dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  auth-service:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    environment:
      <<: *common-env
      PORT: 4001
      MONGODB_URI: ${AUTH_MONGODB_URI:?set AUTH_MONGODB_URI in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - '${AUTH_SERVICE_PORT:-4001}:4001'
    depends_on:
      mongodb:
        condition: service_healthy

  passport-service:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/passport-service/Dockerfile
    environment:
      <<: *common-env
      PORT: 4002
      MONGODB_URI: ${PASSPORT_MONGODB_URI:?set PASSPORT_MONGODB_URI in .env}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:4001}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: passport-service
      KAFKA_SSL: ${KAFKA_SSL:-false}
    ports:
      - '${PASSPORT_SERVICE_PORT:-4002}:4002'
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  document-service:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/document-service/Dockerfile
    environment:
      <<: *common-env
      PORT: 4003
      MONGODB_URI: ${DOCUMENT_MONGODB_URI:?set DOCUMENT_MONGODB_URI in .env}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:4001}
      PASSPORT_SERVICE_URL: ${PASSPORT_SERVICE_URL:-http://passport-service:4002}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-battery-passport-documents}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_PUBLIC_ENDPOINT: ${AWS_S3_PUBLIC_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:-300}
    ports:
      - '${DOCUMENT_SERVICE_PORT:-4003}:4003'
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      passport-service:
        condition: service_healthy

  notification-service:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    environment:
      <<: *common-env
      PORT: 4004
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-notification-service}
      KAFKA_SSL: ${KAFKA_SSL:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Battery Passport Platform <no-reply@battery-passport.local>}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-}
    # Health endpoint only, published on loopback for local inspection
    ports:
      - '127.0.0.1:${NOTIFICATION_SERVICE_PORT:-4004}:4004'
    depends_on:
      kafka:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:4001}
      PASSPORT_SERVICE_URL: ${PASSPORT_SERVICE_URL:-http://passport-service:4002}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:4003}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      auth-service:
        condition: service_healthy
      passport-service:
        condition: service_healthy
      document-service:
        condition: service_healthy

volumes:
  mongodb-data:
  kafka-data:
  localstack-data:
